schema_version: 1

context:
  version: "0.2.0"

package:
  name: af-filesystem-mcp
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/af_filesystem_mcp/af_filesystem_mcp-${{ version }}.tar.gz
  sha256: d9d1768b943b66a6173188f26fb994d7e17776780d2b2e7701c550fd24f9ebb7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=0.7
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - mcp >=2.0.0,<3
    - af-credentials >=0.2.0

tests:
  - python:
      imports:
        - af_filesystem_mcp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: MCP server for per-user, impersonated filesystem access on the AF platform
  homepage: https://github.com/maniaclab/af-filesystem-mcp
  repository: https://github.com/maniaclab/af-filesystem-mcp
  documentation: https://maniaclab.uchicago.edu/af-filesystem-mcp/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kratsg
